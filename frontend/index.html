    <title>BlizPilot — Business dashboard</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #0B1220; }
      .brand-loading-screen { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; background: #0B1220; color: #F7F9FD; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .brand-loading-content { display: grid; justify-items: center; text-align: center; animation: brand-loading-appear .36s ease-out both; }
      .brand-loading-mark { display: grid; place-items: center; width: 82px; height: 82px; margin-bottom: 20px; border-radius: 25px; background: #0057FF; box-shadow: 0 10px 36px #0057ff40; }
      .brand-loading-mark svg { width: 44px; height: 44px; }
      .brand-loading-name { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -.8px; }
      .brand-loading-subtitle { margin-top: 7px; color: #8695AA; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .brand-loading-track { width: 104px; height: 2px; margin-top: 28px; overflow: hidden; border-radius: 2px; background: #28384E; }
      .brand-loading-track::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: #5A91FF; content: ""; animation: brand-loading-progress 1.2s ease-in-out infinite; }
      @keyframes brand-loading-appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes brand-loading-progress { from { transform: translateX(-110%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .brand-loading-content { animation: none; } .brand-loading-track::after { animation: none; transform: translateX(70%); } }
    </style>
  </head>
  <body><div id="root"><main class="brand-loading-screen" role="status" aria-label="Loading BlizPilot"><div class="brand-loading-content"><span class="brand-loading-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><span class="brand-loading-name">BlizPilot</span><span class="brand-loading-subtitle">BUSINESS MANAGER</span><span class="brand-loading-track" aria-hidden="true"></span></div></main></div><script type="module" src="/src/main.tsx"></script></body>
